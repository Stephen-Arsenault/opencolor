<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datacolor ColorReader — Web Bluetooth demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; background: #111; color: #ddd; }
  button { font-size: 1rem; padding: .6rem 1.2rem; margin: .3rem .3rem .3rem 0; cursor: pointer; }
  #log { white-space: pre-wrap; background: #1b1b1b; border: 1px solid #333; border-radius: 6px; padding: 1rem; min-height: 12rem; margin-top: 1rem; font-family: ui-monospace, monospace; font-size: .85rem; }
  .warn { color: #e6b450; }
  code { color: #7fd4a0; }
</style>
</head>
<body>
<h1>Datacolor ColorReader — Web Bluetooth demo</h1>
<p>Pair → info → status → calibrate → match → disconnect. Requires
<code>https://</code> or <code>localhost</code>, and Chrome/Edge (desktop or Android).</p>
<p>
  <button id="cycle">▶ Run full cycle</button>
  <button id="cal">Calibrate only</button>
  <button id="match">Match only</button>
</p>
<div id="log" hidden></div>
<script type="module">
  import { ColorReader, runCycle } from './colorreader.js';
  const log = document.getElementById('log');
  const show = (label, v) => {
    log.hidden = false;
    log.textContent += `${label}: ${JSON.stringify(v, null, 1)}\n`;
  };
  let reader = new ColorReader();
  const guard = async (fn) => {
    try { await fn(); } catch (e) { log.hidden = false; log.textContent += `ERROR: ${e.message}\n`; }
  };
  document.getElementById('cycle').onclick = () => guard(async () => {
    log.textContent = '';
    await runCycle(reader);
    reader = new ColorReader();
  });
  document.getElementById('cal').onclick = () => guard(async () => {
    if (!reader.connected) await reader.connect();
    show('calibrate', await reader.calibrate());
  });
  document.getElementById('match').onclick = () => guard(async () => {
    if (!reader.connected) await reader.connect();
    show('match', await reader.requestMatch());
  });
  if (!('bluetooth' in navigator)) {
    document.body.insertAdjacentHTML('beforeend',
      '<p class="warn">⚠ navigator.bluetooth unavailable — use Chrome/Edge over HTTPS or localhost.</p>');
  }
</script>
</body>
</html>
